{% extends "base.html" %}
{% block title %}无权访问{% endblock %}
{% block page_title %}访问受限{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body" style="text-align:center;padding:56px 24px">
    <div style="font-size:52px;color:#b5452f;line-height:1;margin-bottom:14px">403</div>
    <h2 style="font-size:18px;margin:0 0 8px">当前角色无权访问该功能</h2>
    <p class="muted" style="max-width:520px;margin:0 auto 18px">{{ message }}</p>
    <p class="muted" style="font-size:12.5px">
      若确需使用，请联系系统管理员在「角色权限配置」中为本角色勾选对应菜单与接口权限。
    </p>
    <a class="btn btn-primary" href="{% url 'dashboard' %}">返回工作台</a>
  </div>
</div>
{% endblock %}
